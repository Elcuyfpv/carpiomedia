name: Snapshot Squarespace source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/snapshot-squarespace.yml'
      - 'tools/snapshot_site.py'
      - 'tools/build_exact_manifest.py'
      - 'tools/build_block_manifest.py'
      - 'tools/extract_video_blocks.py'
      - 'tools/resolve_native_videos.py'
      - 'tools/build_one_page_exact.py'

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3 lxml==5.3.0

      - name: Capture exact public site source
        run: python tools/snapshot_site.py

      - name: Build exact page and media manifests
        run: python tools/build_exact_manifest.py

      - name: Map exact Squarespace blocks
        run: python tools/build_block_manifest.py

      - name: Extract native video configuration
        run: python tools/extract_video_blocks.py

      - name: Resolve native video URLs
        run: python tools/resolve_native_videos.py

      - name: Build audited one-page preview
        id: exact_build
        continue-on-error: true
        run: python tools/build_one_page_exact.py

      - name: Commit source inventory, audit and preview
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _source_snapshot
          if [ -f exact-preview.html ]; then git add exact-preview.html; fi
          if git diff --cached --quiet; then
            echo "No inventory, audit or preview changes"
          else
            git commit -m "Build exact one-page Squarespace consolidation [skip ci]"
            git push
          fi

      - name: Enforce exact-build audit
        if: steps.exact_build.outcome != 'success'
        run: exit 1
