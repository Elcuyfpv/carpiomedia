name: Snapshot Squarespace source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/snapshot-squarespace.yml'
      - 'tools/snapshot_site.py'
      - 'tools/build_exact_manifest.py'

permissions:
  contents: write

jobs:
  snapshot:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.12.3 lxml==5.3.0

      - name: Capture exact public site source
        run: python tools/snapshot_site.py

      - name: Build exact page and media manifests
        run: python tools/build_exact_manifest.py

      - name: Commit source inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _source_snapshot
          if git diff --cached --quiet; then
            echo "No inventory changes"
          else
            git commit -m "Snapshot exact Squarespace pages and media [skip ci]"
            git push
          fi
